name: drip
description: DRIP — a private AI wardrobe assistant.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  google_sign_in: ^7.2.0
  go_router: ^17.3.0
  image: ^4.9.1
  image_picker: ^1.2.3
  native_cutout: ^0.2.0
  path_provider: ^2.1.5
  uuid: ^4.5.2
  workmanager: ^0.9.0+3
  http_parser: ^4.1.2
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/female_dummy.png
