name: la_maison_de_miniso
description: La Maison de Miniso — a private AI wardrobe assistant.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  geolocator: ^14.0.3
  google_sign_in: ^7.2.0
  go_router: ^17.3.0
  image: ^4.9.1
  image_picker: ^1.2.3
  path_provider: ^2.1.5
  uuid: ^4.5.2
  http_parser: ^4.1.2
  image_cropper: ^12.2.1
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  geocoding: ^5.0.0
  google_fonts: ^8.2.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/female_dummy.png
    - assets/images/leopard_texture.png
    - assets/images/dark_leopard_texture.png
    - assets/images/app_logo.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/app_logo.jpg"
